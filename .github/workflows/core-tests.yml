name: Core tests

on:
  push:
    paths:
      - "Core/**"
      - ".github/workflows/core-tests.yml"
  pull_request:
    paths:
      - "Core/**"
      - ".github/workflows/core-tests.yml"

jobs:
  swift-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.9"
      - name: Run UltrasEuropaCore tests
        working-directory: Core
        run: swift test
