name: UltrasEuropa
options:
  bundleIdPrefix: com.cormacbrannigan03
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  UltrasEuropaCore:
    path: Core
targets:
  UltrasEuropa:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: UltrasEuropaCore
        product: UltrasEuropaCore
    info:
      path: App/Info.plist
    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.cormacbrannigan03.UltrasEuropa
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  UltrasEuropa:
    build:
      targets:
        UltrasEuropa: all
    run:
      config: Debug
    test:
      config: Debug
