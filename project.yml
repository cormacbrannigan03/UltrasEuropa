name: UltrasEuropa
options:
  bundleIdPrefix: com.cormacbrannigan03
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  UltrasEuropaCore:
    path: Core
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 12.0.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    from: 3.0.0
targets:
  UltrasEuropa:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: UltrasEuropaCore
        product: UltrasEuropaCore
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
        product: GoogleUserMessagingPlatform
    info:
      path: App/Info.plist
    settings:
      base:
        SWIFT_VERSION: "5.9"
        # Force Xcode to use the real App/Info.plist (with its launch
        # screen and orientation keys) rather than auto-generating one
        # from build settings and silently dropping everything that isn't
        # mirrored as an INFOPLIST_KEY_* setting — a generated Info.plist
        # missing UILaunchScreen is what makes iOS letterbox the app at
        # old-iPhone dimensions on a real device.
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.cormacbrannigan03.UltrasEuropa
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  UltrasEuropa:
    build:
      targets:
        UltrasEuropa: all
    run:
      config: Debug
      storeKitConfiguration: App/StoreKit/Configuration.storekit
    test:
      config: Debug
